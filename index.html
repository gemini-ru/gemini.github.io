<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Mobile Canvas Builder</title>
    <!-- Библиотека JSZip для генерации ZIP-архива -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            position: fixed;
        }

        /* Рабочий холст */
        #canvas {
            width: 100vw;
            height: calc(100vh - 145px);
            position: relative;
            background-color: #ffffff;
            overflow: auto;
            touch-action: none;
        }

        /* Перетаскиваемые элементы */
        .draggable-element {
            position: absolute !important;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            outline: 2px dashed transparent;
            transition: outline 0.15s ease;
        }

        .draggable-element.selected {
            outline: 2px solid #007aff;
        }

        /* Нижняя панель управления для телефонов */
        #bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            min-height: 145px;
            background: #f8f9fa;
            border-top: 1px solid #e5e5ea;
            display: flex;
            flex-direction: column;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)) 12px;
            gap: 8px;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.08);
            z-index: 1000;
        }

        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        #prompt-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #c7c7cc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #ffffff;
            min-width: 0; /* Предотвращает вылезание за экран */
        }

        #prompt-input:focus {
            border-color: #007aff;
        }

        button {
            padding: 12px;
            background-color: #007aff;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            active-state: opacity 0.7;
        }

        button:active {
            opacity: 0.7;
        }

        #send-btn {
            min-width: 80px;
        }

        .actions-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        button.secondary {
            background-color: #8e8e93;
            font-size: 12px;
        }

        button.success {
            background-color: #34c759;
            font-size: 12px;
        }

        #status-text {
            font-size: 12px;
            color: #8e8e93;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Модальное окно редактора кода */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-content {
            background: #ffffff;
            width: 100vw;
            height: 85vh;
            border-radius: 16px 16px 0 0;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-tabs {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            padding: 6px 12px;
            background: #e5e5ea;
            color: #000000;
            border-radius: 6px;
            font-size: 13px;
        }

        .tab-btn.active {
            background: #007aff;
            color: #ffffff;
        }

        textarea {
            width: 100%;
            flex: 1;
            font-family: monospace;
            font-size: 13px;
            padding: 10px;
            border: 1px solid #c7c7cc;
            border-radius: 8px;
            resize: none;
            background: #1c1c1e;
            color: #33ff66;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }

        .modal-actions button {
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- Холст для размещения элементов -->
    <div id="canvas"></div>

    <!-- Нижняя мобильная панель -->
    <div id="bottom-panel">
        <div id="status-text">Готово к работе</div>
        <div class="input-group">
            <input type="text" id="prompt-input" placeholder="Введите команду...">
            <button id="send-btn">Создать</button>
        </div>
        <div class="actions-group">
            <button class="secondary" id="open-code-btn">Код</button>
            <button class="success" id="download-zip-btn">Скачать ZIP</button>
        </div>
    </div>

    <!-- Модальное окно просмотра/редактирования кода -->
    <div class="modal" id="code-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="code-tabs">
                    <button class="tab-btn active" onclick="switchTab('html', event)">HTML</button>
                    <button class="tab-btn" onclick="switchTab('css', event)">CSS</button>
                    <button class="tab-btn" onclick="switchTab('js', event)">JS</button>
                </div>
            </div>
            <textarea id="code-editor" spellcheck="false"></textarea>
            <div class="modal-actions">
                <button class="secondary" onclick="closeModal()">Закрыть</button>
                <button onclick="applyCodeChanges()">Применить</button>
            </div>
        </div>
    </div>

    <script>
        // Вшитый API ключ Gemini
        const GEMINI_API_KEY = "AQ.Ab8RN6JmL5b-bTjM9X4CGWa3vvSA2HS_CGkLqUHgu9_xks1LyQ";

        let currentCode = {
            html: '',
            css: '',
            js: ''
        };

        let currentTab = 'html';
        let selectedElement = null;

        document.getElementById('send-btn').addEventListener('click', generateContent);

        async function generateContent() {
            const promptInput = document.getElementById('prompt-input');
            const prompt = promptInput.value.trim();
            const statusText = document.getElementById('status-text');

            if (!prompt) return;

            statusText.innerText = 'Генерация...';

            const contextInfo = selectedElement 
                ? `Пользователь выбрал элемент: "${selectedElement.outerHTML}". Измени или добавь к нему что-то новое.`
                : `Текущий код страницы: HTML: "${currentCode.html}", CSS: "${currentCode.css}", JS: "${currentCode.js}".`;

            const systemPrompt = `Ты — генератор веб-компонентов. Отвечай СТРОГО в формате JSON без разметки markdown (без \`\`\`json).
Формат:
{
  "html": "HTML код",
  "css": "CSS стили (без тегов <style>)",
  "js": "JavaScript код (без тегов <script>)"
}

Контекст: ${contextInfo}
Запрос: "${prompt}"`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }]
                    })
                });

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                
                const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const parsed = JSON.parse(cleanJson);

                updateProject(parsed);
                promptInput.value = '';
                statusText.innerText = 'Успешно создано!';
            } catch (err) {
                console.error(err);
                statusText.innerText = 'Ошибка генерации!';
            }
        }

        function updateProject(parsed) {
            if (parsed.html) currentCode.html += '\n' + parsed.html;
            if (parsed.css) currentCode.css += '\n' + parsed.css;
            if (parsed.js) currentCode.js += '\n' + parsed.js;

            renderCanvas();
        }

        function renderCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = currentCode.html;

            let styleTag = document.getElementById('dynamic-styles');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'dynamic-styles';
                document.head.appendChild(styleTag);
            }
            styleTag.textContent = currentCode.css;

            Array.from(canvas.children).forEach(el => {
                el.classList.add('draggable-element');
                makeElementInteractive(el);
            });
        }

        // Поддержка перетаскивания мышью и пальцем на сенсорном экране
        function makeElementInteractive(element) {
            let startX = 0, startY = 0, initialLeft = 0, initialTop = 0;

            element.addEventListener('touchstart', handleStart, { passive: false });
            element.addEventListener('mousedown', handleStart);

            function handleStart(e) {
                document.querySelectorAll('.draggable-element').forEach(item => item.classList.remove('selected'));
                element.classList.add('selected');
                selectedElement = element;

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;
                initialLeft = element.offsetLeft;
                initialTop = element.offsetTop;

                if (e.touches) {
                    window.addEventListener('touchmove', handleMove, { passive: false });
                    window.addEventListener('touchend', handleEnd);
                } else {
                    window.addEventListener('mousemove', handleMove);
                    window.addEventListener('mouseup', handleEnd);
                }
            }

            function handleMove(e) {
                if (e.cancelable) e.preventDefault();

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                element.style.left = (initialLeft + deltaX) + 'px';
                element.style.top = (initialTop + deltaY) + 'px';
            }

            function handleEnd() {
                window.removeEventListener('touchmove', handleMove);
                window.removeEventListener('touchend', handleEnd);
                window.removeEventListener('mousemove', handleMove);
                window.removeEventListener('mouseup', handleEnd);

                currentCode.html = document.getElementById('canvas').innerHTML;
            }
        }

        // Логика работы модального окна
        const modal = document.getElementById('code-modal');
        const editor = document.getElementById('code-editor');

        document.getElementById('open-code-btn').addEventListener('click', () => {
            modal.style.display = 'flex';
            switchTab(currentTab);
        });

        function closeModal() {
            modal.style.display = 'none';
        }

        function switchTab(tab, e) {
            currentCode[currentTab] = editor.value;
            currentTab = tab;
            
            if (e) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
            }

            editor.value = currentCode[tab];
        }

        function applyCodeChanges() {
            currentCode[currentTab] = editor.value;
            renderCanvas();
            closeModal();
        }

        // Скачивание ZIP-архива
        document.getElementById('download-zip-btn').addEventListener('click', () => {
            const zip = new JSZip();

            const indexContent = `<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
${currentCode.html}
    <script src="script.js"><\/script>
</body>
</html>`;

            zip.file("index.html", indexContent);
            zip.file("style.css", currentCode.css);
            zip.file("script.js", currentCode.js);

            zip.generateAsync({ type: "blob" }).then(function (content) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = "site-project.zip";
                a.click();
            });
        });
    </script>
</body>
</html>
